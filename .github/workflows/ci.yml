name: CI Pipeline

# ============================================================================
# TRIGGER CONDITIONS
# ============================================================================
# Run on every push to any branch and every pull request
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# ============================================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================================
env:
  PYTHON_VERSION: '3.12'
  API_PORT: 8000
  HEALTH_CHECK_MAX_ATTEMPTS: 30
  HEALTH_CHECK_INTERVAL: 2

# ============================================================================
# CI JOBS
# ============================================================================
jobs:
  # --------------------------------------------------------------------------
  # JOB: Test Suite
  # --------------------------------------------------------------------------
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Fail-fast protection
    
    # Optional: Test against multiple Python versions
    strategy:
      fail-fast: false  # Continue testing other versions even if one fails
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      # ======================================================================
      # STEP 1: Checkout Repository
      # ======================================================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # ======================================================================
      # STEP 2: Set Up Python Environment
      # ======================================================================
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      # ======================================================================
      # STEP 3: Cache pip Dependencies
      # ======================================================================
      - name: 📦 Cache pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      # ======================================================================
      # STEP 4: Upgrade pip
      # ======================================================================
      - name: ⬆️ Upgrade pip
        run: |
          python -m pip install --upgrade pip
      
      # ======================================================================
      # STEP 5: Install Dependencies
      # ======================================================================
      - name: 📚 Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-cov allure-pytest
      
      # ======================================================================
      # STEP 6: Create Dummy API Key File
      # ======================================================================
      - name: 🔑 Create Dummy Anthropic API Key
        run: |
          echo "sk-ant-api03-ci-dummy-key-for-testing-only" > .anthropickey
          echo "✅ Dummy API key file created (not a real key)"
      
      # ======================================================================
      # STEP 7: Display Python Environment Info
      # ======================================================================
      - name: ℹ️ Display Environment Info
        run: |
          echo "Python version:"
          python --version
          echo ""
          echo "Pip version:"
          pip --version
          echo ""
          echo "Installed packages:"
          pip list
      
      # ======================================================================
      # STEP 8: Run Core and API Tests (No ERPNext Required)
      # ======================================================================
      - name: 🧪 Run Core and API Tests with Coverage
        run: |
          echo "Running all core and API tests with comprehensive coverage..."
          pytest tests/core tests/api -v --alluredir=allure-results
          
          echo ""
          echo "Coverage Summary:"
          python -m coverage report --include="app/*" --show-missing
          
          echo "✅ Core and API tests completed with full app coverage"
      # ======================================================================
      # STEP 9: Generate Allure Environment Metadata
      # ======================================================================
      - name: 📝 Generate Allure Environment Info
        if: always()
        run: |
          mkdir -p allure-results
          cat > allure-results/environment.properties << EOF
          Python.Version=${{ matrix.python-version }}
          OS=${{ runner.os }}
          Test.Execution.Date=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          CI.Run.ID=${{ github.run_id }}
          CI.Run.Number=${{ github.run_number }}
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          Repository=${{ github.repository }}
          EOF
          echo "✅ Allure environment metadata generated"
      
      # ======================================================================
      # STEP 10: Upload Allure Results
      # ======================================================================
      - name: 📤 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-python-${{ matrix.python-version }}
          path: allure-results/
          retention-days: 30
      
      # ======================================================================
      # STEP 11: Upload Coverage Reports to Codecov
      # ======================================================================
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

      # ======================================================================
      # STEP 12: Run ERPNext Integration Tests (Optional)---Seperately
      # ======================================================================
      - name: 🔗 Run ERPNext Integration Tests
        if: success() || failure()
        env:
          ERPNEXT_URL: ${{ secrets.ERPNEXT_URL || 'http://localhost:8080' }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY || '' }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET || '' }}
        run: |
          echo "Running ERPNext integration tests with pytest (real connection)..."
          
          if [ -n "$ERPNEXT_API_KEY" ]; then
            echo "ERPNEXT_URL=$ERPNEXT_URL" > .env
            echo "ERPNEXT_API_KEY=$ERPNEXT_API_KEY" >> .env
            echo "ERPNEXT_API_SECRET=$ERPNEXT_API_SECRET" >> .env
            echo "✅ ERPNext credentials configured"
          else
            echo "⚠️  ERPNext credentials not found - tests will be skipped"
          fi
          
          pytest tests/integration -v || {
            echo "⚠️  ERPNext integration tests skipped or failed (non-blocking)"
          }
      
      # ======================================================================
      # STEP 13: Test Summary
      # ======================================================================
      - name: 📊 Test Summary
        if: always()
        run: |
          echo "=========================================="
          echo "CI Pipeline Summary"
          echo "=========================================="
          echo "Python Version: ${{ matrix.python-version }}"
          echo "OS: ${{ runner.os }}"
          echo "Runner: ${{ runner.name }}"
          echo ""
          echo "Test Execution Summary:"
          echo "  ✅ Core tests: Completed"
          echo "  ✅ API tests: Completed"
          echo "  ⚠️  ERPNext integration: See above"
          echo "=========================================="
  
  # --------------------------------------------------------------------------
  # JOB: Generate and Deploy Allure Report
  # --------------------------------------------------------------------------
  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      # ======================================================================
      # STEP 1: Checkout Repository
      # ======================================================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # ======================================================================
      # STEP 2: Download Allure Results from All Python Versions
      # ======================================================================
      - name: 📥 Download Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-python-*
          path: allure-results-combined
          merge-multiple: true
      
      # ======================================================================
      # STEP 3: Get Allure History from gh-pages
      # ======================================================================
      - name: 📜 Get Allure History
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      
      # ======================================================================
      # STEP 4: Copy History from gh-pages
      # ======================================================================
      - name: 📋 Copy Allure History
        continue-on-error: true
        run: |
          if [ -d "gh-pages/allure-history" ]; then
            mkdir -p allure-history
            cp -r gh-pages/allure-history/* allure-history/ 2>/dev/null || true
            echo "✅ Copied Allure history from gh-pages"
          else
            echo "⚠️  No previous Allure history found"
          fi
      
      # ======================================================================
      # STEP 5: Generate Allure Report
      # ======================================================================
      - name: 📊 Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results-combined
          allure_history: allure-history
          keep_reports: 20
      
      # ======================================================================
      # STEP 6: Upload Allure Report as Artifact
      # ======================================================================
      - name: 📤 Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-history/
          retention-days: 30
      
      # ======================================================================
      # STEP 7: Deploy to GitHub Pages
      # ======================================================================
      - name: 🚀 Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
      
      # ======================================================================
      # STEP 8: Report Summary
      # ======================================================================
      - name: 📊 Report Summary
        run: |
          echo "=========================================="
          echo "Allure Report Generated and Deployed"
          echo "=========================================="
          echo "Report available at:"
          echo "  📊 Artifact: Check workflow artifacts"
          echo "  🌐 GitHub Pages: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "=========================================="
      
      

