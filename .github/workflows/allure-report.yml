name: Allure Report

# Generate and publish Allure HTML report from test results
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    
    steps:
      # ======================================================================
      # STEP 1: Checkout Repository
      # ======================================================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # ======================================================================
      # STEP 2: Download Allure Results from All Python Versions
      # ======================================================================
      - name: 📥 Download Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-python-*
          path: allure-results-combined
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      
      # ======================================================================
      # STEP 3: Get Allure History from gh-pages
      # ======================================================================
      - name: 📜 Get Allure History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      
      # ======================================================================
      # STEP 4: Generate Allure Report
      # ======================================================================
      - name: 📊 Generate Allure Report
        uses: uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results-combined
          allure_history: allure-history
          keep_reports: 20
      
      # ======================================================================
      # STEP 5: Copy History from gh-pages
      # ======================================================================
      - name: 📋 Copy Allure History
        if: always()
        continue-on-error: true
        run: |
          if [ -d "gh-pages/allure-history" ]; then
            cp -r gh-pages/allure-history/* allure-history/ 2>/dev/null || true
            echo "✅ Copied Allure history from gh-pages"
          else
            echo "⚠️  No previous Allure history found"
          fi
      
      # ======================================================================
      # STEP 6: Upload Allure Report as Artifact
      # ======================================================================
      - name: 📤 Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-history/
          retention-days: 30
      
      # ======================================================================
      # STEP 7: Deploy to GitHub Pages
      # ======================================================================
      - name: 🚀 Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
      
      # ======================================================================
      # STEP 8: Report Summary
      # ======================================================================
      - name: 📊 Report Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Allure Report Generated"
          echo "=========================================="
          echo "Report available at:"
          echo "  📊 Artifact: Check workflow artifacts"
          echo "  🌐 GitHub Pages: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "=========================================="
